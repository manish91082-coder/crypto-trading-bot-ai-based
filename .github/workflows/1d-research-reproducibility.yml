name: 1D Research Reproducibility

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-1d-research.txt

      - name: Run all focused regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run 1D research-only pipeline and accounting reconciliation
        run: python src/audits/run_1d_research_reproducibility.py

      - name: Save exact resolved dependency versions
        if: always()
        run: |
          mkdir -p artifacts/1d_reproducibility
          python -m pip freeze > artifacts/1d_reproducibility/pip-freeze.txt

      - name: Upload run logs, metrics, ledgers, model hashes and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1d-research-reproducibility-${{ github.sha }}
          path: artifacts/1d_reproducibility/
          if-no-files-found: error
          retention-days: 30
